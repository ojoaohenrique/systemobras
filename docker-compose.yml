# Sobe só o PostgreSQL (para quem tem Docker). Uso: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: obras
      POSTGRES_PASSWORD: troque-esta-senha
      POSTGRES_DB: obras
    ports:
      - "5432:5432"
    volumes:
      - dados_obras:/var/lib/postgresql/data
volumes:
  dados_obras:
