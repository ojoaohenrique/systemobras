<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Gestão de Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="hero">
  <form class="card" id="f">
    <img src="/img/logo.png" alt="Pró Vasconcelos – Lotes e Condomínios">
    <h1>Gestão de Obras</h1>
    <p class="mut">Entre com seu e-mail e senha.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button class="b p full" id="ok">Entrar</button>
    <p class="msg" id="msg"></p>
  </form>
</div>
<script src="/js/login.js"></script>
</body>
</html>
